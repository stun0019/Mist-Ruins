<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>迷霧遺跡｜場景編輯器</title>

  <style>
    :root {
      --background: #0b100c;
      --panel: #18211a;
      --border: #3c493f;
      --text: #f2efdf;
      --muted: #a9b3aa;
      --accent: #d7b56d;
      --button: #28362c;
      --button-hover: #35483a;
      --danger: #b95959;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    .editor-header {
      position: sticky;
      top: 0;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      padding: 14px 18px;

      background: rgba(12, 17, 13, 0.96);
      border-bottom: 1px solid var(--border);
    }

    .editor-header h1 {
      margin: 0;
      font-size: 20px;
    }

    .save-status {
      margin-top: 3px;
      color: var(--accent);
      font-size: 13px;
    }

    .editor-layout {
      display: grid;
      grid-template-columns:
        260px
        minmax(0, 1fr)
        330px;

      gap: 14px;
      padding: 14px;
    }

    .panel {
      min-width: 0;
      padding: 15px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: var(--panel);
    }

    .panel-title {
      margin-bottom: 12px;
      font-weight: 700;
    }

    .section {
      margin-top: 20px;
    }

    .canvas-panel {
      min-width: 0;
      min-height: 720px;
      padding: 14px;

      overflow: auto;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: #070a08;
    }

    canvas {
      display: block;

      border: 1px solid #5b6a5e;

      background: #253127;

      image-rendering: pixelated;
      cursor: crosshair;
    }

    button,
    .button {
      width: 100%;
      padding: 10px 12px;

      border: 1px solid #556459;
      border-radius: 9px;

      background: var(--button);
      color: var(--text);

      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;

      cursor: pointer;
    }

    button:hover,
    .button:hover {
      background: var(--button-hover);
    }

    button.active {
      outline: 2px solid var(--accent);
      background: #475743;
    }

    button.danger {
      border-color: #754747;
      background: #4f2d2d;
    }

    .stack {
      display: grid;
      gap: 9px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #48564b;
      border-radius: 8px;
      background: #0e1410;
      color: var(--text);
      font: inherit;
    }

    input,
    select {
      padding: 9px;
    }

    textarea {
      min-height: 280px;
      padding: 10px;
      resize: vertical;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;

      font-size: 12px;
      line-height: 1.5;
    }

    input[type="range"] {
      padding: 0;
    }

    .dimension-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .current-mode {
      margin-bottom: 12px;
      padding: 9px;

      border: 1px solid #526054;
      border-radius: 8px;

      background: #202b23;
      color: var(--accent);

      font-size: 13px;
      text-align: center;
    }

    .helper-text {
      margin-top: 13px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .asset-preview {
      min-height: 170px;
      margin-top: 10px;
      padding: 8px;

      display: grid;
      place-items: center;

      overflow: hidden;

      border: 1px solid #48564b;
      border-radius: 9px;

      background: #101612;
    }

    .asset-preview img {
      display: block;
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .asset-preview span {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .list-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;

      margin-top: 8px;
      padding: 8px;

      border: 1px solid #3d4a40;
      border-radius: 8px;

      background: #111812;
    }

    .list-item-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .list-item button {
      width: auto;
      padding: 6px 9px;
      font-size: 12px;
    }

    .opacity-row {
      display: grid;
      grid-template-columns: 1fr 48px;
      gap: 8px;
      align-items: center;
    }

    .path-status {
      margin-top: 12px;
      padding: 10px;

      border: 1px solid #555b43;
      border-radius: 8px;

      background: #22271c;

      color: #ecd788;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 1080px) {
      .editor-layout {
        grid-template-columns: 1fr;
      }

      .canvas-panel {
        order: -1;
        min-height: 420px;
      }
    }
  </style>
</head>

<body>
  <header class="editor-header">
    <div>
      <h1>ScriptEditor｜迷霧遺跡</h1>

      <div id="saveStatus" class="save-status">
        尚未儲存
      </div>
    </div>

    <a class="button" href="index.html">
      返回遊戲
    </a>
  </header>

  <main class="editor-layout">
    <aside class="panel">
      <div class="panel-title">
        編輯模式
      </div>

      <div
        id="currentModeText"
        class="current-mode"
      >
        目前模式：碰撞 Path
      </div>

      <div id="modeButtons" class="stack"></div>

      <div class="section">
        <div class="panel-title">
          物件工具
        </div>

        <div id="objectButtons" class="tool-grid"></div>
      </div>

      <div id="pathStatus" class="path-status">
        尚未開始繪製 Path
      </div>

      <div class="section stack">
        <button id="finishPathButton" type="button">
          完成目前 Path
        </button>

        <button id="undoPointButton" type="button">
          移除上一個錨點
        </button>

        <button id="cancelPathButton" type="button">
          取消目前 Path
        </button>
      </div>

      <div class="section stack">
        <button id="saveButton" type="button">
          儲存到瀏覽器
        </button>

        <button id="resetDefaultButton" type="button">
          還原預設地圖
        </button>
      </div>

      <div class="helper-text">
        左鍵：新增錨點。<br>
        滑鼠移動：預覽下一條線。<br>
        Enter：完成並閉合 Path。<br>
        Backspace：移除上一個錨點。<br>
        右鍵／Esc：取消目前 Path。
      </div>
    </aside>

    <section class="canvas-panel">
      <canvas
        id="editorCanvas"
        width="1920"
        height="1080"
        aria-label="迷霧遺跡場景編輯區"
      ></canvas>
    </section>

    <aside class="panel">
      <div class="panel-title">
        背景素材庫
      </div>

      <label for="assetNameInput">
        素材名稱
      </label>

      <input
        id="assetNameInput"
        type="text"
        placeholder="例如：Starting Area"
      >

      <label for="assetPathInput">
        專案內素材路徑
      </label>

      <input
        id="assetPathInput"
        type="text"
        value="./assets/BG/Starting%20Area.png"
        placeholder="./assets/BG/圖片名稱.png"
      >

      <button
        id="previewAssetButton"
        type="button"
        style="margin-top: 9px"
      >
        預覽素材
      </button>

      <div class="asset-preview">
        <span id="assetPreviewMessage">
          尚未預覽素材
        </span>

        <img
          id="assetPreviewImage"
          alt="背景素材預覽"
          hidden
        >
      </div>

      <div class="stack">
        <button id="addAssetButton" type="button">
          新增至素材庫
        </button>

        <select id="backgroundAssetSelect"></select>

        <button
          id="applyBackgroundButton"
          type="button"
        >
          套用為目前背景
        </button>

        <button
          id="syncSizeButton"
          type="button"
        >
          地圖尺寸同步背景圖片
        </button>
      </div>

      <label for="backgroundOpacityInput">
        背景透明度
      </label>

      <div class="opacity-row">
        <input
          id="backgroundOpacityInput"
          type="range"
          min="0.1"
          max="1"
          step="0.05"
          value="1"
        >

        <span id="backgroundOpacityText">
          100%
        </span>
      </div>

      <div id="assetList"></div>

      <div class="section">
        <div class="panel-title">
          地圖尺寸
        </div>

        <div class="dimension-grid">
          <div>
            <label for="mapWidthInput">
              寬度 px
            </label>

            <input
              id="mapWidthInput"
              type="number"
              min="320"
              max="10000"
              value="1920"
            >
          </div>

          <div>
            <label for="mapHeightInput">
              高度 px
            </label>

            <input
              id="mapHeightInput"
              type="number"
              min="240"
              max="10000"
              value="1080"
            >
          </div>
        </div>

        <button
          id="resizeButton"
          type="button"
          style="margin-top: 9px"
        >
          套用地圖尺寸
        </button>
      </div>

      <div class="section">
        <div class="panel-title">
          Path 清單
        </div>

        <div id="pathList"></div>
      </div>

      <div class="section">
        <label for="jsonTextarea">
          地圖 JSON
        </label>

        <textarea id="jsonTextarea"></textarea>
      </div>

      <div class="stack">
        <button id="applyJsonButton" type="button">
          套用 JSON
        </button>

        <button id="exportButton" type="button">
          下載 JSON
        </button>

        <label class="button" for="importInput">
          匯入 JSON
        </label>

        <input
          id="importInput"
          type="file"
          accept=".json,application/json"
          hidden
        >
      </div>
    </aside>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "mistRuinsMapV4";

      const canvas =
        document.getElementById("editorCanvas");

      const context =
        canvas.getContext("2d");

      if (!context) {
        throw new Error("瀏覽器不支援 Canvas 2D。");
      }

      context.imageSmoothingEnabled = false;

      const saveStatus =
        document.getElementById("saveStatus");

      const currentModeText =
        document.getElementById("currentModeText");

      const modeButtons =
        document.getElementById("modeButtons");

      const objectButtons =
        document.getElementById("objectButtons");

      const pathStatus =
        document.getElementById("pathStatus");

      const finishPathButton =
        document.getElementById("finishPathButton");

      const undoPointButton =
        document.getElementById("undoPointButton");

      const cancelPathButton =
        document.getElementById("cancelPathButton");

      const saveButton =
        document.getElementById("saveButton");

      const resetDefaultButton =
        document.getElementById("resetDefaultButton");

      const assetNameInput =
        document.getElementById("assetNameInput");

      const assetPathInput =
        document.getElementById("assetPathInput");

      const previewAssetButton =
        document.getElementById("previewAssetButton");

      const assetPreviewMessage =
        document.getElementById("assetPreviewMessage");

      const assetPreviewImage =
        document.getElementById("assetPreviewImage");

      const addAssetButton =
        document.getElementById("addAssetButton");

      const backgroundAssetSelect =
        document.getElementById("backgroundAssetSelect");

      const applyBackgroundButton =
        document.getElementById("applyBackgroundButton");

      const syncSizeButton =
        document.getElementById("syncSizeButton");

      const backgroundOpacityInput =
        document.getElementById("backgroundOpacityInput");

      const backgroundOpacityText =
        document.getElementById("backgroundOpacityText");

      const assetList =
        document.getElementById("assetList");

      const mapWidthInput =
        document.getElementById("mapWidthInput");

      const mapHeightInput =
        document.getElementById("mapHeightInput");

      const resizeButton =
        document.getElementById("resizeButton");

      const pathList =
        document.getElementById("pathList");

      const jsonTextarea =
        document.getElementById("jsonTextarea");

      const applyJsonButton =
        document.getElementById("applyJsonButton");

      const exportButton =
        document.getElementById("exportButton");

      const importInput =
        document.getElementById("importInput");

      const MODES = [
        {
          id: "collisionPath",
          name: "碰撞 Path"
        },
        {
          id: "foregroundPath",
          name: "前景 Path"
        },
        {
          id: "objects",
          name: "物件放置"
        }
      ];

      const OBJECT_TOOLS = [
        {
          id: "playerSpawn",
          name: "出生點"
        },
        {
          id: "enemy",
          name: "敵人"
        },
        {
          id: "key",
          name: "鑰匙"
        },
        {
          id: "chest",
          name: "寶箱"
        },
        {
          id: "exit",
          name: "終點"
        },
        {
          id: "eraseObject",
          name: "移除物件"
        }
      ];

      let activeMode = "collisionPath";
      let activeObjectTool = "playerSpawn";

      let mapData = loadMap();

      let editorBackgroundImage = null;
      let editorBackgroundReady = false;

      const drawingState = {
        active: false,
        points: [],
        previewPoint: null
      };

      function createDefaultMap() {
        return {
          version: 4,

          width: 1920,
          height: 1080,

          background: {
            assetId: "starting-area",
            name: "Starting Area",
            src: "./assets/BG/Starting%20Area.png",
            opacity: 1,
            visible: true
          },

          assets: {
            backgrounds: [
              {
                id: "starting-area",
                name: "Starting Area",
                src: "./assets/BG/Starting%20Area.png"
              }
            ]
          },

          collisionPaths: [],

          foregroundPaths: [],

          objects: [
            {
              id: "player-spawn",
              type: "playerSpawn",
              x: 220,
              y: 540
            },
            {
              id: "enemy-1",
              type: "enemy",
              x: 720,
              y: 480
            },
            {
              id: "enemy-2",
              type: "enemy",
              x: 1120,
              y: 650
            },
            {
              id: "key-1",
              type: "key",
              x: 1430,
              y: 410
            },
            {
              id: "chest-1",
              type: "chest",
              x: 1580,
              y: 760
            },
            {
              id: "exit-1",
              type: "exit",
              x: 1760,
              y: 540
            }
          ]
        };
      }

      function normalizePoint(point) {
        return {
          x: Number(point?.x) || 0,
          y: Number(point?.y) || 0
        };
      }

      function normalizePath(path, index) {
        return {
          id:
            String(path?.id || `path-${index}`),

          type: "polygon",

          points:
            Array.isArray(path?.points)
              ? path.points.map(normalizePoint)
              : []
        };
      }

      function normalizeMap(data) {
        if (
          !data ||
          !Number.isFinite(Number(data.width)) ||
          !Number.isFinite(Number(data.height))
        ) {
          throw new Error("地圖尺寸格式錯誤。");
        }

        data.width =
          Math.max(320, Number(data.width));

        data.height =
          Math.max(240, Number(data.height));

        if (!data.assets) {
          data.assets = {};
        }

        if (!Array.isArray(data.assets.backgrounds)) {
          data.assets.backgrounds = [];
        }

        if (!Array.isArray(data.collisionPaths)) {
          data.collisionPaths = [];
        }

        if (!Array.isArray(data.foregroundPaths)) {
          data.foregroundPaths = [];
        }

        if (!Array.isArray(data.objects)) {
          data.objects = [];
        }

        data.collisionPaths =
          data.collisionPaths.map(normalizePath);

        data.foregroundPaths =
          data.foregroundPaths.map(normalizePath);

        data.objects =
          data.objects.map(
            (object, index) => ({
              id:
                String(
                  object.id ||
                  `${object.type || "object"}-${index}`
                ),

              type:
                String(
                  object.type || "unknown"
                ),

              x:
                Number(object.x) || 0,

              y:
                Number(object.y) || 0
            })
          );

        return data;
      }

      function loadMap() {
        try {
          const stored =
            localStorage.getItem(STORAGE_KEY);

          if (!stored) {
            return createDefaultMap();
          }

          return normalizeMap(
            JSON.parse(stored)
          );
        } catch (error) {
          console.error(
            "地圖讀取失敗：",
            error
          );

          return createDefaultMap();
        }
      }

      function markUnsaved(
        message = "尚未儲存"
      ) {
        saveStatus.textContent = message;
      }

      function updateJson() {
        jsonTextarea.value =
          JSON.stringify(
            mapData,
            null,
            2
          );

        markUnsaved();
      }

      function synchronizeCanvasSize() {
        canvas.width = mapData.width;
        canvas.height = mapData.height;

        mapWidthInput.value =
          String(mapData.width);

        mapHeightInput.value =
          String(mapData.height);

        updateJson();
        drawEditor();
      }

      function renderModeButtons() {
        modeButtons.innerHTML = "";

        for (const mode of MODES) {
          const button =
            document.createElement("button");

          button.type = "button";
          button.textContent = mode.name;

          if (mode.id === activeMode) {
            button.classList.add("active");
          }

          button.addEventListener(
            "click",
            () => {
              cancelCurrentPath();

              activeMode = mode.id;

              currentModeText.textContent =
                `目前模式：${mode.name}`;

              renderModeButtons();
              renderObjectButtons();
              renderPathList();
              drawEditor();
            }
          );

          modeButtons.appendChild(button);
        }
      }

      function renderObjectButtons() {
        objectButtons.innerHTML = "";

        for (
          const tool of OBJECT_TOOLS
        ) {
          const button =
            document.createElement("button");

          button.type = "button";
          button.textContent = tool.name;

          if (
            activeMode === "objects" &&
            tool.id === activeObjectTool
          ) {
            button.classList.add("active");
          }

          button.disabled =
            activeMode !== "objects";

          button.addEventListener(
            "click",
            () => {
              activeObjectTool = tool.id;

              renderObjectButtons();
            }
          );

          objectButtons.appendChild(button);
        }
      }

      function ensureAssetLibrary() {
        if (!mapData.assets) {
          mapData.assets = {};
        }

        if (
          !Array.isArray(
            mapData.assets.backgrounds
          )
        ) {
          mapData.assets.backgrounds = [];
        }
      }

      function createAssetId(name) {
        const basicId =
          name
            .trim()
            .toLowerCase()
            .replace(/\s+/g, "-")
            .replace(
              /[^a-z0-9-_]/g,
              ""
            );

        return (
          basicId ||
          `background-${Date.now()}`
        );
      }

      function previewAsset(source) {
        const finalSource =
          source.trim();

        assetPreviewImage.hidden = true;

        assetPreviewMessage.hidden = false;

        if (!finalSource) {
          assetPreviewMessage.textContent =
            "請輸入素材路徑";

          return;
        }

        assetPreviewMessage.textContent =
          "素材載入中";

        assetPreviewImage.onload = () => {
          assetPreviewImage.hidden = false;
          assetPreviewMessage.hidden = true;
        };

        assetPreviewImage.onerror = () => {
          assetPreviewImage.hidden = true;

          assetPreviewMessage.hidden = false;

          assetPreviewMessage.textContent =
            "素材載入失敗，請檢查路徑";
        };

        assetPreviewImage.src =
          finalSource;
      }

      function addBackgroundAsset() {
        ensureAssetLibrary();

        const name =
          assetNameInput.value.trim();

        const src =
          assetPathInput.value.trim();

        if (!name || !src) {
          alert(
            "請輸入素材名稱與素材路徑。"
          );

          return;
        }

        const duplicated =
          mapData.assets.backgrounds.some(
            (asset) =>
              asset.src === src ||
              asset.name === name
          );

        if (duplicated) {
          alert(
            "素材庫中已有相同素材。"
          );

          return;
        }

        const asset = {
          id: createAssetId(name),
          name,
          src
        };

        mapData.assets.backgrounds.push(
          asset
        );

        renderAssetLibrary();

        backgroundAssetSelect.value =
          asset.id;

        updateJson();

        markUnsaved(
          "素材已新增，尚未儲存"
        );
      }

      function removeBackgroundAsset(
        assetId
      ) {
        const currentAssetId =
          mapData.background?.assetId;

        if (assetId === currentAssetId) {
          alert(
            "目前正在使用此背景，請先套用其他背景。"
          );

          return;
        }

        mapData.assets.backgrounds =
          mapData.assets.backgrounds.filter(
            (asset) =>
              asset.id !== assetId
          );

        renderAssetLibrary();
        updateJson();
      }

      function renderAssetLibrary() {
        ensureAssetLibrary();

        backgroundAssetSelect.innerHTML =
          "";

        assetList.innerHTML = "";

        for (
          const asset of
          mapData.assets.backgrounds
        ) {
          const option =
            document.createElement("option");

          option.value = asset.id;
          option.textContent = asset.name;

          backgroundAssetSelect.appendChild(
            option
          );

          const item =
            document.createElement("div");

          item.className = "list-item";

          const name =
            document.createElement("div");

          name.className =
            "list-item-name";

          name.textContent = asset.name;
          name.title = asset.src;

          const removeButton =
            document.createElement("button");

          removeButton.type = "button";
          removeButton.textContent = "移除";
          removeButton.className = "danger";

          removeButton.addEventListener(
            "click",
            () => {
              removeBackgroundAsset(
                asset.id
              );
            }
          );

          item.appendChild(name);
          item.appendChild(removeButton);

          assetList.appendChild(item);
        }

        if (mapData.background?.assetId) {
          backgroundAssetSelect.value =
            mapData.background.assetId;
        }
      }

      function applySelectedBackground() {
        ensureAssetLibrary();

        const selectedId =
          backgroundAssetSelect.value;

        const asset =
          mapData.assets.backgrounds.find(
            (item) =>
              item.id === selectedId
          );

        if (!asset) {
          alert(
            "找不到選擇的素材。"
          );

          return;
        }

        mapData.background = {
          assetId: asset.id,
          name: asset.name,
          src: asset.src,

          opacity:
            Number(
              backgroundOpacityInput.value
            ),

          visible: true
        };

        loadEditorBackground();
        updateJson();

        markUnsaved(
          `已套用背景：${asset.name}`
        );
      }

      function loadEditorBackground() {
        editorBackgroundImage = null;
        editorBackgroundReady = false;

        const source =
          mapData.background?.src;

        if (!source) {
          drawEditor();
          return;
        }

        const image = new Image();

        image.addEventListener(
          "load",
          () => {
            editorBackgroundImage = image;
            editorBackgroundReady = true;

            drawEditor();
          }
        );

        image.addEventListener(
          "error",
          () => {
            editorBackgroundImage = null;
            editorBackgroundReady = false;

            console.error(
              "編輯器背景載入失敗：",
              source
            );

            drawEditor();
          }
        );

        image.src = source;
      }

      function syncMapSizeToBackground() {
        if (
          !editorBackgroundReady ||
          !editorBackgroundImage
        ) {
          alert(
            "背景圖片尚未載入。"
          );

          return;
        }

        mapData.width =
          editorBackgroundImage.naturalWidth;

        mapData.height =
          editorBackgroundImage.naturalHeight;

        synchronizeCanvasSize();

        markUnsaved(
          "地圖尺寸已同步背景圖片"
        );
      }

      function getWorldPointFromPointer(
        event
      ) {
        const rectangle =
          canvas.getBoundingClientRect();

        const scaleX =
          canvas.width /
          rectangle.width;

        const scaleY =
          canvas.height /
          rectangle.height;

        return {
          x:
            Math.round(
              (
                event.clientX -
                rectangle.left
              ) *
              scaleX
            ),

          y:
            Math.round(
              (
                event.clientY -
                rectangle.top
              ) *
              scaleY
            )
        };
      }

      function isInsideMap(point) {
        return (
          point.x >= 0 &&
          point.y >= 0 &&
          point.x <= mapData.width &&
          point.y <= mapData.height
        );
      }

      function addPathPoint(point) {
        if (!isInsideMap(point)) {
          return;
        }

        if (!drawingState.active) {
          drawingState.active = true;
          drawingState.points = [];
        }

        drawingState.points.push(point);
        drawingState.previewPoint = point;

        updatePathStatus();
        drawEditor();
      }

      function updatePathPreview(point) {
        if (!drawingState.active) {
          return;
        }

        drawingState.previewPoint = point;

        drawEditor();
      }

      function getCurrentPathCollection() {
        if (
          activeMode === "collisionPath"
        ) {
          return mapData.collisionPaths;
        }

        if (
          activeMode === "foregroundPath"
        ) {
          return mapData.foregroundPaths;
        }

        return null;
      }

      function getCurrentPathPrefix() {
        if (
          activeMode === "collisionPath"
        ) {
          return "collision";
        }

        return "foreground";
      }

      function completeCurrentPath() {
        if (!drawingState.active) {
          return;
        }

        if (
          drawingState.points.length < 3
        ) {
          alert(
            "Path 至少需要三個錨點。"
          );

          return;
        }

        const collection =
          getCurrentPathCollection();

        if (!collection) {
          return;
        }

        collection.push({
          id:
            `${getCurrentPathPrefix()}-${Date.now()}`,

          type: "polygon",

          points:
            drawingState.points.map(
              (point) => ({
                x: Math.round(point.x),
                y: Math.round(point.y)
              })
            )
        });

        drawingState.active = false;
        drawingState.points = [];
        drawingState.previewPoint = null;

        updateJson();
        updatePathStatus();
        renderPathList();
        drawEditor();

        markUnsaved(
          "Path 已建立，尚未儲存"
        );
      }

      function undoLastPoint() {
        if (!drawingState.active) {
          return;
        }

        drawingState.points.pop();

        if (
          drawingState.points.length === 0
        ) {
          cancelCurrentPath();
          return;
        }

        drawingState.previewPoint =
          drawingState.points[
            drawingState.points.length - 1
          ];

        updatePathStatus();
        drawEditor();
      }

      function cancelCurrentPath() {
        drawingState.active = false;
        drawingState.points = [];
        drawingState.previewPoint = null;

        updatePathStatus();
        drawEditor();
      }

      function updatePathStatus() {
        if (!drawingState.active) {
          pathStatus.textContent =
            "尚未開始繪製 Path";

          return;
        }

        pathStatus.textContent =
          `目前錨點：${drawingState.points.length} 個。` +
          "按 Enter 完成，右鍵取消。";
      }

      function placeObject(point) {
        if (
          activeObjectTool ===
          "eraseObject"
        ) {
          const removeRadius = 24;

          mapData.objects =
            mapData.objects.filter(
              (object) =>
                Math.hypot(
                  object.x - point.x,
                  object.y - point.y
                ) > removeRadius
            );

          updateJson();
          drawEditor();

          return;
        }

        if (
          activeObjectTool ===
          "playerSpawn"
        ) {
          mapData.objects =
            mapData.objects.filter(
              (object) =>
                object.type !==
                "playerSpawn"
            );
        }

        if (
          activeObjectTool === "exit"
        ) {
          mapData.objects =
            mapData.objects.filter(
              (object) =>
                object.type !== "exit"
            );
        }

        mapData.objects.push({
          id:
            `${activeObjectTool}-${Date.now()}`,

          type: activeObjectTool,

          x: point.x,
          y: point.y
        });

        updateJson();
        drawEditor();
      }

      function removePath(
        collectionName,
        pathId
      ) {
        mapData[collectionName] =
          mapData[collectionName].filter(
            (path) =>
              path.id !== pathId
          );

        updateJson();
        renderPathList();
        drawEditor();
      }

      function renderPathList() {
        pathList.innerHTML = "";

        const collections = [
          {
            name: "碰撞",
            key: "collisionPaths"
          },
          {
            name: "前景",
            key: "foregroundPaths"
          }
        ];

        for (
          const collection of collections
        ) {
          for (
            const path of
            mapData[collection.key]
          ) {
            const item =
              document.createElement("div");

            item.className = "list-item";

            const name =
              document.createElement("div");

            name.className =
              "list-item-name";

            name.textContent =
              `${collection.name}｜` +
              `${path.points.length} 點`;

            name.title = path.id;

            const deleteButton =
              document.createElement("button");

            deleteButton.type = "button";
            deleteButton.textContent =
              "刪除";

            deleteButton.className =
              "danger";

            deleteButton.addEventListener(
              "click",
              () => {
                removePath(
                  collection.key,
                  path.id
                );
              }
            );

            item.appendChild(name);
            item.appendChild(deleteButton);

            pathList.appendChild(item);
          }
        }

        if (
          mapData.collisionPaths.length === 0 &&
          mapData.foregroundPaths.length === 0
        ) {
          const empty =
            document.createElement("div");

          empty.className =
            "helper-text";

          empty.textContent =
            "尚未建立任何 Path。";

          pathList.appendChild(empty);
        }
      }

      function resizeMap() {
        const width =
          Math.max(
            320,
            Math.min(
              10000,
              Number(mapWidthInput.value)
            )
          );

        const height =
          Math.max(
            240,
            Math.min(
              10000,
              Number(mapHeightInput.value)
            )
          );

        mapData.width = width;
        mapData.height = height;

        mapData.objects =
          mapData.objects.filter(
            (object) =>
              object.x <= width &&
              object.y <= height
          );

        synchronizeCanvasSize();
      }

      function drawBackground() {
        context.fillStyle = "#253127";

        context.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        if (
          !editorBackgroundReady ||
          !editorBackgroundImage
        ) {
          return;
        }

        context.save();

        context.globalAlpha =
          mapData.background?.opacity ?? 1;

        context.drawImage(
          editorBackgroundImage,
          0,
          0,
          canvas.width,
          canvas.height
        );

        context.restore();
      }

      function drawPolygon(
        path,
        fillStyle,
        strokeStyle
      ) {
        if (path.points.length < 3) {
          return;
        }

        context.save();

        context.beginPath();

        context.moveTo(
          path.points[0].x,
          path.points[0].y
        );

        for (
          let index = 1;
          index < path.points.length;
          index += 1
        ) {
          context.lineTo(
            path.points[index].x,
            path.points[index].y
          );
        }

        context.closePath();

        context.fillStyle = fillStyle;
        context.strokeStyle = strokeStyle;
        context.lineWidth = 2;

        context.fill();
        context.stroke();

        context.restore();
      }

      function drawSavedPaths() {
        for (
          const path of
          mapData.collisionPaths
        ) {
          drawPolygon(
            path,
            "rgba(220, 65, 65, 0.30)",
            "rgba(255, 125, 125, 0.95)"
          );
        }

        for (
          const path of
          mapData.foregroundPaths
        ) {
          drawPolygon(
            path,
            "rgba(44, 111, 59, 0.30)",
            "rgba(123, 215, 139, 0.95)"
          );
        }
      }

      function drawCurrentPath() {
        if (
          !drawingState.active ||
          drawingState.points.length === 0
        ) {
          return;
        }

        const points =
          drawingState.points;

        context.save();

        context.beginPath();

        context.moveTo(
          points[0].x,
          points[0].y
        );

        for (
          let index = 1;
          index < points.length;
          index += 1
        ) {
          context.lineTo(
            points[index].x,
            points[index].y
          );
        }

        if (drawingState.previewPoint) {
          context.lineTo(
            drawingState.previewPoint.x,
            drawingState.previewPoint.y
          );
        }

        context.strokeStyle =
          activeMode === "collisionPath"
            ? "#ffd080"
            : "#91e8a0";

        context.lineWidth = 2;
        context.stroke();

        for (const point of points) {
          context.fillStyle = "#fff2b0";

          context.beginPath();

          context.arc(
            point.x,
            point.y,
            6,
            0,
            Math.PI * 2
          );

          context.fill();

          context.strokeStyle = "#40371a";
          context.stroke();
        }

        context.restore();
      }

      function drawObject(object) {
        const centerX = object.x;
        const centerY = object.y;

        context.textAlign = "center";
        context.textBaseline = "middle";
        context.font =
          "700 10px system-ui";

        if (
          object.type ===
          "playerSpawn"
        ) {
          context.fillStyle = "#d7b56d";

          context.beginPath();

          context.arc(
            centerX,
            centerY,
            13,
            0,
            Math.PI * 2
          );

          context.fill();

          context.fillStyle = "#1d231d";

          context.fillText(
            "P",
            centerX,
            centerY
          );
        }

        if (object.type === "enemy") {
          context.fillStyle = "#a8515e";

          context.beginPath();

          context.arc(
            centerX,
            centerY,
            13,
            0,
            Math.PI * 2
          );

          context.fill();

          context.fillStyle = "#ffffff";

          context.fillText(
            "E",
            centerX,
            centerY
          );
        }

        if (object.type === "key") {
          context.fillStyle = "#eed16e";

          context.beginPath();

          context.arc(
            centerX - 5,
            centerY,
            7,
            0,
            Math.PI * 2
          );

          context.fill();

          context.fillRect(
            centerX,
            centerY - 2,
            15,
            4
          );
        }

        if (object.type === "chest") {
          context.fillStyle = "#795333";

          context.fillRect(
            centerX - 14,
            centerY - 10,
            28,
            20
          );

          context.fillStyle = "#d7b56d";

          context.fillRect(
            centerX - 2,
            centerY - 4,
            4,
            8
          );
        }

        if (object.type === "exit") {
          context.strokeStyle = "#f0d375";
          context.lineWidth = 3;

          context.strokeRect(
            centerX - 15,
            centerY - 15,
            30,
            30
          );

          context.fillStyle = "#ffffff";

          context.fillText(
            "END",
            centerX,
            centerY
          );

          context.lineWidth = 1;
        }
      }

      function drawObjects() {
        for (
          const object of
          mapData.objects
        ) {
          drawObject(object);
        }
      }

      function drawGrid() {
        const gridSize = 100;

        context.strokeStyle =
          "rgba(255, 255, 255, 0.07)";

        context.lineWidth = 1;

        for (
          let x = 0;
          x <= canvas.width;
          x += gridSize
        ) {
          context.beginPath();

          context.moveTo(x, 0);

          context.lineTo(
            x,
            canvas.height
          );

          context.stroke();
        }

        for (
          let y = 0;
          y <= canvas.height;
          y += gridSize
        ) {
          context.beginPath();

          context.moveTo(0, y);

          context.lineTo(
            canvas.width,
            y
          );

          context.stroke();
        }
      }

      function drawEditor() {
        context.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        drawBackground();
        drawSavedPaths();
        drawObjects();
        drawCurrentPath();
        drawGrid();
      }

      canvas.addEventListener(
        "mousedown",
        (event) => {
          if (event.button !== 0) {
            return;
          }

          const point =
            getWorldPointFromPointer(
              event
            );

          if (activeMode === "objects") {
            placeObject(point);
            return;
          }

          addPathPoint(point);
        }
      );

      canvas.addEventListener(
        "mousemove",
        (event) => {
          if (!drawingState.active) {
            return;
          }

          updatePathPreview(
            getWorldPointFromPointer(
              event
            )
          );
        }
      );

      canvas.addEventListener(
        "contextmenu",
        (event) => {
          event.preventDefault();

          cancelCurrentPath();
        }
      );

      window.addEventListener(
        "keydown",
        (event) => {
          if (
            event.key === "Enter" &&
            drawingState.active
          ) {
            event.preventDefault();

            completeCurrentPath();
          }

          if (
            event.key === "Escape" &&
            drawingState.active
          ) {
            event.preventDefault();

            cancelCurrentPath();
          }

          if (
            event.key === "Backspace" &&
            drawingState.active
          ) {
            event.preventDefault();

            undoLastPoint();
          }
        }
      );

      finishPathButton.addEventListener(
        "click",
        completeCurrentPath
      );

      undoPointButton.addEventListener(
        "click",
        undoLastPoint
      );

      cancelPathButton.addEventListener(
        "click",
        cancelCurrentPath
      );

      previewAssetButton.addEventListener(
        "click",
        () => {
          previewAsset(
            assetPathInput.value
          );
        }
      );

      addAssetButton.addEventListener(
        "click",
        addBackgroundAsset
      );

      applyBackgroundButton.addEventListener(
        "click",
        applySelectedBackground
      );

      syncSizeButton.addEventListener(
        "click",
        syncMapSizeToBackground
      );

      backgroundOpacityInput.addEventListener(
        "input",
        () => {
          const opacity =
            Number(
              backgroundOpacityInput.value
            );

          backgroundOpacityText.textContent =
            `${Math.round(
              opacity * 100
            )}%`;

          if (mapData.background) {
            mapData.background.opacity =
              opacity;
          }

          updateJson();
          drawEditor();
        }
      );

      resizeButton.addEventListener(
        "click",
        resizeMap
      );

      saveButton.addEventListener(
        "click",
        () => {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(mapData)
          );

          saveStatus.textContent =
            "已儲存，可返回遊戲重新讀取";
        }
      );

      resetDefaultButton.addEventListener(
        "click",
        () => {
          mapData = createDefaultMap();

          activeMode =
            "collisionPath";

          activeObjectTool =
            "playerSpawn";

          cancelCurrentPath();

          renderModeButtons();
          renderObjectButtons();
          renderAssetLibrary();
          renderPathList();

          backgroundOpacityInput.value =
            String(
              mapData.background.opacity
            );

          backgroundOpacityText.textContent =
            "100%";

          synchronizeCanvasSize();
          loadEditorBackground();

          markUnsaved(
            "已還原預設地圖"
          );
        }
      );

      applyJsonButton.addEventListener(
        "click",
        () => {
          try {
            mapData = normalizeMap(
              JSON.parse(
                jsonTextarea.value
              )
            );

            cancelCurrentPath();

            renderAssetLibrary();
            renderPathList();

            synchronizeCanvasSize();
            loadEditorBackground();

            backgroundOpacityInput.value =
              String(
                mapData.background?.opacity ??
                1
              );

            backgroundOpacityText.textContent =
              `${Math.round(
                (
                  mapData.background?.opacity ??
                  1
                ) * 100
              )}%`;

            markUnsaved(
              "JSON 已套用，尚未儲存"
            );
          } catch (error) {
            alert(
              `JSON 格式錯誤：${error.message}`
            );
          }
        }
      );

      exportButton.addEventListener(
        "click",
        () => {
          const content =
            JSON.stringify(
              mapData,
              null,
              2
            );

          const blob =
            new Blob(
              [content],
              {
                type: "application/json"
              }
            );

          const url =
            URL.createObjectURL(blob);

          const anchor =
            document.createElement("a");

          anchor.href = url;

          anchor.download =
            "mist-ruins-map-v4.json";

          anchor.click();

          URL.revokeObjectURL(url);
        }
      );

      importInput.addEventListener(
        "change",
        async () => {
          const file =
            importInput.files?.[0];

          if (!file) {
            return;
          }

          try {
            const content =
              await file.text();

            mapData = normalizeMap(
              JSON.parse(content)
            );

            cancelCurrentPath();

            renderAssetLibrary();
            renderPathList();

            synchronizeCanvasSize();
            loadEditorBackground();

            backgroundOpacityInput.value =
              String(
                mapData.background?.opacity ??
                1
              );

            backgroundOpacityText.textContent =
              `${Math.round(
                (
                  mapData.background?.opacity ??
                  1
                ) * 100
              )}%`;

            markUnsaved(
              "JSON 已匯入，尚未儲存"
            );
          } catch (error) {
            alert(
              `匯入失敗：${error.message}`
            );
          } finally {
            importInput.value = "";
          }
        }
      );

      renderModeButtons();
      renderObjectButtons();
      renderAssetLibrary();
      renderPathList();

      backgroundOpacityInput.value =
        String(
          mapData.background?.opacity ?? 1
        );

      backgroundOpacityText.textContent =
        `${Math.round(
          (
            mapData.background?.opacity ??
            1
          ) * 100
        )}%`;

      synchronizeCanvasSize();
      loadEditorBackground();
      updatePathStatus();
    })();
  </script>
</body>
</html>
