<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>迷霧遺跡｜場景編輯器</title>

  <style>
    :root {
      --background: #0b100c;
      --panel: #18211a;
      --border: #3c493f;
      --text: #f2efdf;
      --muted: #a9b3aa;
      --accent: #d7b56d;
      --button: #28362c;
      --button-hover: #35483a;
      --danger: #b95959;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    .editor-header {
      position: sticky;
      top: 0;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      padding: 14px 18px;

      background: rgba(12, 17, 13, 0.96);
      border-bottom: 1px solid var(--border);
    }

    .editor-header h1 {
      margin: 0;
      font-size: 20px;
    }

    .save-status {
      margin-top: 3px;
      color: var(--accent);
      font-size: 13px;
    }

    .editor-layout {
      display: grid;
      grid-template-columns:
        250px
        minmax(0, 1fr)
        320px;

      gap: 14px;
      padding: 14px;
    }

    .panel {
      min-width: 0;
      padding: 15px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: var(--panel);
    }

    .panel-title {
      margin-bottom: 12px;
      font-weight: 700;
    }

    .section {
      margin-top: 20px;
    }

    .canvas-panel {
      min-width: 0;
      min-height: 680px;
      padding: 14px;

      overflow: auto;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: #070a08;
    }

    canvas {
      display: block;

      border: 1px solid #5b6a5e;

      background: #253127;

      image-rendering: pixelated;
      cursor: crosshair;
    }

    button,
    .button {
      width: 100%;
      padding: 10px 12px;

      border: 1px solid #556459;
      border-radius: 9px;

      background: var(--button);
      color: var(--text);

      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;

      cursor: pointer;
    }

    button:hover,
    .button:hover {
      background: var(--button-hover);
    }

    button.active {
      outline: 2px solid var(--accent);
      background: #475743;
    }

    button.danger {
      border-color: #754747;
      background: #4f2d2d;
    }

    .stack {
      display: grid;
      gap: 9px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;

      border: 1px solid #48564b;
      border-radius: 8px;

      background: #0e1410;
      color: var(--text);

      font: inherit;
    }

    input,
    select {
      padding: 9px;
    }

    textarea {
      min-height: 280px;
      padding: 10px;

      resize: vertical;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;

      font-size: 12px;
      line-height: 1.5;
    }

    input[type="range"] {
      padding: 0;
    }

    .dimension-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .current-layer {
      margin-bottom: 12px;
      padding: 9px;

      border: 1px solid #526054;
      border-radius: 8px;

      background: #202b23;
      color: var(--accent);

      font-size: 13px;
      text-align: center;
    }

    .helper-text {
      margin-top: 13px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .asset-preview {
      min-height: 170px;
      margin-top: 10px;
      padding: 8px;

      display: grid;
      place-items: center;

      overflow: hidden;

      border: 1px solid #48564b;
      border-radius: 9px;

      background: #101612;
    }

    .asset-preview img {
      display: block;
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .asset-preview span {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .asset-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;

      margin-top: 8px;
      padding: 8px;

      border: 1px solid #3d4a40;
      border-radius: 8px;

      background: #111812;
    }

    .asset-item-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .asset-item button {
      width: auto;
      padding: 6px 9px;
      font-size: 12px;
    }

    .opacity-row {
      display: grid;
      grid-template-columns: 1fr 45px;
      gap: 8px;
      align-items: center;
    }

    @media (max-width: 1080px) {
      .editor-layout {
        grid-template-columns: 1fr;
      }

      .canvas-panel {
        order: -1;
        min-height: 400px;
      }
    }
  </style>
</head>

<body>
  <header class="editor-header">
    <div>
      <h1>ScriptEditor｜迷霧遺跡</h1>

      <div id="saveStatus" class="save-status">
        尚未儲存
      </div>
    </div>

    <a class="button" href="index.html">
      返回遊戲
    </a>
  </header>

  <main class="editor-layout">
    <aside class="panel">
      <div class="panel-title">
        編輯圖層
      </div>

      <div
        id="currentLayerText"
        class="current-layer"
      >
        目前圖層：碰撞層
      </div>

      <div id="layerButtons" class="stack"></div>

      <div class="section">
        <div class="panel-title">
          工具
        </div>

        <div id="toolButtons" class="tool-grid"></div>
      </div>

      <div class="section stack">
        <button id="saveButton" type="button">
          儲存到瀏覽器
        </button>

        <button id="clearLayerButton" type="button">
          清空目前圖層
        </button>

        <button id="resetDefaultButton" type="button">
          還原預設地圖
        </button>
      </div>

      <div class="helper-text">
        碰撞層紅色區域代表不可通行。<br>
        前景層會繪製在玩家上方。<br>
        物件層可放置玩家、敵人、鑰匙、寶箱與終點。
      </div>
    </aside>

    <section class="canvas-panel">
      <canvas
        id="editorCanvas"
        width="1920"
        height="1080"
        aria-label="迷霧遺跡場景編輯區"
      ></canvas>
    </section>

    <aside class="panel">
      <div class="panel-title">
        背景素材庫
      </div>

      <label for="assetNameInput">
        素材名稱
      </label>

      <input
        id="assetNameInput"
        type="text"
        placeholder="例如：Starting Area"
      >

      <label for="assetPathInput">
        專案內素材路徑
      </label>

      <input
        id="assetPathInput"
        type="text"
        value="./assets/BG/Starting%20Area.png"
        placeholder="./assets/BG/圖片名稱.png"
      >

      <button
        id="previewAssetButton"
        type="button"
        style="margin-top: 9px"
      >
        預覽素材
      </button>

      <div class="asset-preview">
        <span id="assetPreviewMessage">
          尚未預覽素材
        </span>

        <img
          id="assetPreviewImage"
          alt="背景素材預覽"
          hidden
        >
      </div>

      <div class="stack">
        <button id="addAssetButton" type="button">
          新增至素材庫
        </button>

        <select id="backgroundAssetSelect"></select>

        <button
          id="applyBackgroundButton"
          type="button"
        >
          套用為目前背景
        </button>
      </div>

      <label for="backgroundOpacityInput">
        背景透明度
      </label>

      <div class="opacity-row">
        <input
          id="backgroundOpacityInput"
          type="range"
          min="0.1"
          max="1"
          step="0.05"
          value="1"
        >

        <span id="backgroundOpacityText">
          100%
        </span>
      </div>

      <div id="assetList"></div>

      <div class="section">
        <div class="panel-title">
          地圖尺寸
        </div>

        <div class="dimension-grid">
          <div>
            <label for="columnsInput">
              欄數
            </label>

            <input
              id="columnsInput"
              type="number"
              min="12"
              max="100"
              value="48"
            >
          </div>

          <div>
            <label for="rowsInput">
              列數
            </label>

            <input
              id="rowsInput"
              type="number"
              min="10"
              max="80"
              value="27"
            >
          </div>
        </div>

        <button
          id="resizeButton"
          type="button"
          style="margin-top: 9px"
        >
          調整地圖尺寸
        </button>
      </div>

      <div class="section">
        <label for="jsonTextarea">
          地圖 JSON
        </label>

        <textarea id="jsonTextarea"></textarea>
      </div>

      <div class="stack">
        <button id="applyJsonButton" type="button">
          套用 JSON
        </button>

        <button id="exportButton" type="button">
          下載 JSON
        </button>

        <label class="button" for="importInput">
          匯入 JSON
        </label>

        <input
          id="importInput"
          type="file"
          accept=".json,application/json"
          hidden
        >
      </div>
    </aside>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "mistRuinsMapV3";
      const TILE_SIZE = 40;

      const canvas =
        document.getElementById("editorCanvas");

      const context =
        canvas.getContext("2d");

      if (!context) {
        throw new Error("瀏覽器不支援 Canvas 2D。");
      }

      context.imageSmoothingEnabled = false;

      const saveStatus =
        document.getElementById("saveStatus");

      const currentLayerText =
        document.getElementById("currentLayerText");

      const layerButtons =
        document.getElementById("layerButtons");

      const toolButtons =
        document.getElementById("toolButtons");

      const assetNameInput =
        document.getElementById("assetNameInput");

      const assetPathInput =
        document.getElementById("assetPathInput");

      const previewAssetButton =
        document.getElementById("previewAssetButton");

      const assetPreviewMessage =
        document.getElementById("assetPreviewMessage");

      const assetPreviewImage =
        document.getElementById("assetPreviewImage");

      const addAssetButton =
        document.getElementById("addAssetButton");

      const backgroundAssetSelect =
        document.getElementById("backgroundAssetSelect");

      const applyBackgroundButton =
        document.getElementById("applyBackgroundButton");

      const backgroundOpacityInput =
        document.getElementById("backgroundOpacityInput");

      const backgroundOpacityText =
        document.getElementById("backgroundOpacityText");

      const assetList =
        document.getElementById("assetList");

      const columnsInput =
        document.getElementById("columnsInput");

      const rowsInput =
        document.getElementById("rowsInput");

      const resizeButton =
        document.getElementById("resizeButton");

      const jsonTextarea =
        document.getElementById("jsonTextarea");

      const saveButton =
        document.getElementById("saveButton");

      const clearLayerButton =
        document.getElementById("clearLayerButton");

      const resetDefaultButton =
        document.getElementById("resetDefaultButton");

      const applyJsonButton =
        document.getElementById("applyJsonButton");

      const exportButton =
        document.getElementById("exportButton");

      const importInput =
        document.getElementById("importInput");

      const LAYERS = [
        {
          id: "collision",
          name: "碰撞層"
        },
        {
          id: "foreground",
          name: "前景層"
        },
        {
          id: "objects",
          name: "物件層"
        }
      ];

      const COLLISION_TOOLS = [
        {
          id: 1,
          name: "不可通行"
        },
        {
          id: 0,
          name: "可通行"
        }
      ];

      const FOREGROUND_TOOLS = [
        {
          id: 1,
          name: "前景遮擋"
        },
        {
          id: 0,
          name: "清除前景"
        }
      ];

      const OBJECT_TOOLS = [
        {
          id: "playerSpawn",
          name: "出生點"
        },
        {
          id: "enemy",
          name: "敵人"
        },
        {
          id: "key",
          name: "鑰匙"
        },
        {
          id: "chest",
          name: "寶箱"
        },
        {
          id: "exit",
          name: "終點"
        },
        {
          id: "eraseObject",
          name: "移除物件"
        }
      ];

      let activeLayer = "collision";
      let activeTool = 1;

      let isDrawing = false;

      let mapData = loadMap();

      let editorBackgroundImage = null;
      let editorBackgroundReady = false;

      function createLayer(
        columns,
        rows,
        fillValue = 0
      ) {
        return Array.from(
          { length: rows },
          () => Array(columns).fill(fillValue)
        );
      }

      function createDefaultMap() {
        const columns = 48;
        const rows = 27;

        const collision =
          createLayer(columns, rows, 0);

        const foreground =
          createLayer(columns, rows, 0);

        for (let x = 0; x < columns; x += 1) {
          collision[0][x] = 1;
          collision[rows - 1][x] = 1;
        }

        for (let y = 0; y < rows; y += 1) {
          collision[y][0] = 1;
          collision[y][columns - 1] = 1;
        }

        return {
          version: 3,

          columns,
          rows,
          tileSize: TILE_SIZE,

          background: {
            assetId: "starting-area",
            name: "Starting Area",
            src: "./assets/BG/Starting%20Area.png",
            opacity: 1,
            visible: true
          },

          assets: {
            backgrounds: [
              {
                id: "starting-area",
                name: "Starting Area",
                src: "./assets/BG/Starting%20Area.png"
              }
            ]
          },

          layers: {
            collision,
            foreground
          },

          objects: [
            {
              type: "playerSpawn",
              x: 5,
              y: 13
            },
            {
              type: "enemy",
              x: 18,
              y: 12
            },
            {
              type: "enemy",
              x: 28,
              y: 16
            },
            {
              type: "key",
              x: 34,
              y: 10
            },
            {
              type: "chest",
              x: 40,
              y: 18
            },
            {
              type: "exit",
              x: 44,
              y: 13
            }
          ]
        };
      }

      function normalizeLayer(
        source,
        columns,
        rows
      ) {
        return Array.from(
          { length: rows },
          (_, y) =>
            Array.from(
              { length: columns },
              (_, x) => source?.[y]?.[x] ?? 0
            )
        );
      }

      function normalizeMap(data) {
        if (
          !data ||
          !Number.isInteger(data.columns) ||
          !Number.isInteger(data.rows)
        ) {
          throw new Error("地圖格式錯誤。");
        }

        data.tileSize = TILE_SIZE;

        if (!data.layers) {
          data.layers = {};
        }

        data.layers.collision =
          normalizeLayer(
            data.layers.collision,
            data.columns,
            data.rows
          );

        data.layers.foreground =
          normalizeLayer(
            data.layers.foreground,
            data.columns,
            data.rows
          );

        if (!Array.isArray(data.objects)) {
          data.objects = [];
        }

        if (!data.assets) {
          data.assets = {};
        }

        if (!Array.isArray(data.assets.backgrounds)) {
          data.assets.backgrounds = [];
        }

        return data;
      }

      function loadMap() {
        try {
          const stored =
            localStorage.getItem(STORAGE_KEY);

          if (!stored) {
            return createDefaultMap();
          }

          return normalizeMap(
            JSON.parse(stored)
          );
        } catch (error) {
          console.error(
            "地圖讀取失敗：",
            error
          );

          return createDefaultMap();
        }
      }

      function markUnsaved(message = "尚未儲存") {
        saveStatus.textContent = message;
      }

      function updateJson() {
        jsonTextarea.value =
          JSON.stringify(
            mapData,
            null,
            2
          );

        markUnsaved();
      }

      function synchronizeCanvasSize() {
        canvas.width =
          mapData.columns * TILE_SIZE;

        canvas.height =
          mapData.rows * TILE_SIZE;

        columnsInput.value =
          String(mapData.columns);

        rowsInput.value =
          String(mapData.rows);

        updateJson();
        drawEditor();
      }

      function getToolsForLayer() {
        if (activeLayer === "collision") {
          return COLLISION_TOOLS;
        }

        if (activeLayer === "foreground") {
          return FOREGROUND_TOOLS;
        }

        return OBJECT_TOOLS;
      }

      function renderLayerButtons() {
        layerButtons.innerHTML = "";

        for (const layer of LAYERS) {
          const button =
            document.createElement("button");

          button.type = "button";
          button.textContent = layer.name;

          if (layer.id === activeLayer) {
            button.classList.add("active");
          }

          button.addEventListener(
            "click",
            () => {
              activeLayer = layer.id;

              activeTool =
                getToolsForLayer()[0].id;

              currentLayerText.textContent =
                `目前圖層：${layer.name}`;

              renderLayerButtons();
              renderToolButtons();
              drawEditor();
            }
          );

          layerButtons.appendChild(button);
        }
      }

      function renderToolButtons() {
        toolButtons.innerHTML = "";

        const tools =
          getToolsForLayer();

        for (const tool of tools) {
          const button =
            document.createElement("button");

          button.type = "button";
          button.textContent = tool.name;

          if (tool.id === activeTool) {
            button.classList.add("active");
          }

          button.addEventListener(
            "click",
            () => {
              activeTool = tool.id;
              renderToolButtons();
            }
          );

          toolButtons.appendChild(button);
        }
      }

      function ensureAssetLibrary() {
        if (!mapData.assets) {
          mapData.assets = {};
        }

        if (
          !Array.isArray(
            mapData.assets.backgrounds
          )
        ) {
          mapData.assets.backgrounds = [];
        }
      }

      function createAssetId(name) {
        const basicId = name
          .trim()
          .toLowerCase()
          .replace(/\s+/g, "-")
          .replace(/[^a-z0-9-_]/g, "");

        return (
          basicId ||
          `background-${Date.now()}`
        );
      }

      function previewAsset(source) {
        const finalSource =
          source.trim();

        assetPreviewImage.hidden = true;
        assetPreviewMessage.hidden = false;

        if (!finalSource) {
          assetPreviewMessage.textContent =
            "請輸入素材路徑";

          return;
        }

        assetPreviewMessage.textContent =
          "素材載入中";

        assetPreviewImage.onload = () => {
          assetPreviewImage.hidden = false;
          assetPreviewMessage.hidden = true;
        };

        assetPreviewImage.onerror = () => {
          assetPreviewImage.hidden = true;
          assetPreviewMessage.hidden = false;

          assetPreviewMessage.textContent =
            "素材載入失敗，請檢查路徑";
        };

        assetPreviewImage.src = finalSource;
      }

      function addBackgroundAsset() {
        ensureAssetLibrary();

        const name =
          assetNameInput.value.trim();

        const src =
          assetPathInput.value.trim();

        if (!name || !src) {
          alert(
            "請輸入素材名稱與素材路徑。"
          );

          return;
        }

        const duplicated =
          mapData.assets.backgrounds.some(
            (asset) =>
              asset.src === src ||
              asset.name === name
          );

        if (duplicated) {
          alert("素材庫中已有相同素材。");
          return;
        }

        const asset = {
          id: createAssetId(name),
          name,
          src
        };

        mapData.assets.backgrounds.push(asset);

        renderAssetLibrary();

        backgroundAssetSelect.value =
          asset.id;

        updateJson();

        markUnsaved("素材已新增，尚未儲存");
      }

      function removeBackgroundAsset(assetId) {
        ensureAssetLibrary();

        const currentAssetId =
          mapData.background?.assetId;

        if (assetId === currentAssetId) {
          alert(
            "目前正在使用此背景，請先套用其他背景。"
          );

          return;
        }

        mapData.assets.backgrounds =
          mapData.assets.backgrounds.filter(
            (asset) =>
              asset.id !== assetId
          );

        renderAssetLibrary();
        updateJson();
      }

      function renderAssetLibrary() {
        ensureAssetLibrary();

        backgroundAssetSelect.innerHTML = "";
        assetList.innerHTML = "";

        for (
          const asset of
          mapData.assets.backgrounds
        ) {
          const option =
            document.createElement("option");

          option.value = asset.id;
          option.textContent = asset.name;

          backgroundAssetSelect.appendChild(option);

          const item =
            document.createElement("div");

          item.className = "asset-item";

          const name =
            document.createElement("div");

          name.className = "asset-item-name";
          name.textContent = asset.name;
          name.title = asset.src;

          const removeButton =
            document.createElement("button");

          removeButton.type = "button";
          removeButton.textContent = "移除";
          removeButton.className = "danger";

          removeButton.addEventListener(
            "click",
            () => {
              removeBackgroundAsset(
                asset.id
              );
            }
          );

          item.appendChild(name);
          item.appendChild(removeButton);

          assetList.appendChild(item);
        }

        if (mapData.background?.assetId) {
          backgroundAssetSelect.value =
            mapData.background.assetId;
        }
      }

      function applySelectedBackground() {
        ensureAssetLibrary();

        const selectedId =
          backgroundAssetSelect.value;

        const asset =
          mapData.assets.backgrounds.find(
            (item) =>
              item.id === selectedId
          );

        if (!asset) {
          alert("找不到選擇的素材。");
          return;
        }

        mapData.background = {
          assetId: asset.id,
          name: asset.name,
          src: asset.src,
          opacity:
            Number(
              backgroundOpacityInput.value
            ),
          visible: true
        };

        loadEditorBackground();
        updateJson();

        markUnsaved(
          `已套用背景：${asset.name}`
        );
      }

      function loadEditorBackground() {
        editorBackgroundImage = null;
        editorBackgroundReady = false;

        const source =
          mapData.background?.src;

        if (!source) {
          drawEditor();
          return;
        }

        const image = new Image();

        image.addEventListener(
          "load",
          () => {
            editorBackgroundImage = image;
            editorBackgroundReady = true;

            drawEditor();
          }
        );

        image.addEventListener(
          "error",
          () => {
            editorBackgroundImage = null;
            editorBackgroundReady = false;

            console.error(
              "編輯器背景載入失敗：",
              source
            );

            drawEditor();
          }
        );

        image.src = source;
      }

      function getCellFromPointer(event) {
        const rectangle =
          canvas.getBoundingClientRect();

        const scaleX =
          canvas.width / rectangle.width;

        const scaleY =
          canvas.height / rectangle.height;

        return {
          x: Math.floor(
            (
              event.clientX -
              rectangle.left
            ) *
            scaleX /
            TILE_SIZE
          ),

          y: Math.floor(
            (
              event.clientY -
              rectangle.top
            ) *
            scaleY /
            TILE_SIZE
          )
        };
      }

      function isInsideMap(x, y) {
        return (
          x >= 0 &&
          y >= 0 &&
          x < mapData.columns &&
          y < mapData.rows
        );
      }

      function placeObject(x, y) {
        if (activeTool === "eraseObject") {
          mapData.objects =
            mapData.objects.filter(
              (object) =>
                !(
                  object.x === x &&
                  object.y === y
                )
            );

          return;
        }

        if (activeTool === "playerSpawn") {
          mapData.objects =
            mapData.objects.filter(
              (object) =>
                object.type !==
                "playerSpawn"
            );
        }

        if (activeTool === "exit") {
          mapData.objects =
            mapData.objects.filter(
              (object) =>
                object.type !== "exit"
            );
        }

        const existing =
          mapData.objects.findIndex(
            (object) =>
              object.x === x &&
              object.y === y &&
              object.type === activeTool
          );

        if (existing >= 0) {
          mapData.objects.splice(existing, 1);
          return;
        }

        mapData.objects.push({
          type: activeTool,
          x,
          y
        });
      }

      function paintCell(event) {
        const cell =
          getCellFromPointer(event);

        if (!isInsideMap(cell.x, cell.y)) {
          return;
        }

        if (activeLayer === "objects") {
          placeObject(cell.x, cell.y);
        } else {
          mapData.layers[activeLayer]
            [cell.y][cell.x] = activeTool;
        }

        updateJson();
        drawEditor();
      }

      function resizeLayer(
        source,
        columns,
        rows
      ) {
        return Array.from(
          { length: rows },
          (_, y) =>
            Array.from(
              { length: columns },
              (_, x) =>
                source?.[y]?.[x] ?? 0
            )
        );
      }

      function resizeMap() {
        const columns = Math.max(
          12,
          Math.min(
            100,
            Number(columnsInput.value)
          )
        );

        const rows = Math.max(
          10,
          Math.min(
            80,
            Number(rowsInput.value)
          )
        );

        mapData.layers.collision =
          resizeLayer(
            mapData.layers.collision,
            columns,
            rows
          );

        mapData.layers.foreground =
          resizeLayer(
            mapData.layers.foreground,
            columns,
            rows
          );

        mapData.columns = columns;
        mapData.rows = rows;

        mapData.objects =
          mapData.objects.filter(
            (object) =>
              object.x < columns &&
              object.y < rows
          );

        synchronizeCanvasSize();
        loadEditorBackground();
      }

      function clearCurrentLayer() {
        if (activeLayer === "objects") {
          mapData.objects = [];
        } else {
          mapData.layers[activeLayer] =
            createLayer(
              mapData.columns,
              mapData.rows,
              0
            );
        }

        updateJson();
        drawEditor();
      }

      function drawBackground() {
        context.fillStyle = "#253127";

        context.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        if (
          !editorBackgroundReady ||
          !editorBackgroundImage
        ) {
          return;
        }

        context.save();

        context.globalAlpha =
          mapData.background?.opacity ?? 1;

        context.drawImage(
          editorBackgroundImage,
          0,
          0,
          canvas.width,
          canvas.height
        );

        context.restore();
      }

      function drawCollisionLayer() {
        if (activeLayer !== "collision") {
          return;
        }

        for (
          let y = 0;
          y < mapData.rows;
          y += 1
        ) {
          for (
            let x = 0;
            x < mapData.columns;
            x += 1
          ) {
            if (
              mapData.layers.collision
                [y][x] !== 1
            ) {
              continue;
            }

            const screenX =
              x * TILE_SIZE;

            const screenY =
              y * TILE_SIZE;

            context.fillStyle =
              "rgba(220, 65, 65, 0.36)";

            context.fillRect(
              screenX,
              screenY,
              TILE_SIZE,
              TILE_SIZE
            );

            context.strokeStyle =
              "rgba(255, 130, 130, 0.9)";

            context.beginPath();

            context.moveTo(
              screenX,
              screenY
            );

            context.lineTo(
              screenX + TILE_SIZE,
              screenY + TILE_SIZE
            );

            context.moveTo(
              screenX + TILE_SIZE,
              screenY
            );

            context.lineTo(
              screenX,
              screenY + TILE_SIZE
            );

            context.stroke();
          }
        }
      }

      function drawForegroundLayer() {
        for (
          let y = 0;
          y < mapData.rows;
          y += 1
        ) {
          for (
            let x = 0;
            x < mapData.columns;
            x += 1
          ) {
            if (
              mapData.layers.foreground
                [y][x] !== 1
            ) {
              continue;
            }

            context.fillStyle =
              activeLayer === "foreground"
                ? "rgba(45, 111, 58, 0.48)"
                : "rgba(24, 54, 31, 0.20)";

            context.fillRect(
              x * TILE_SIZE,
              y * TILE_SIZE,
              TILE_SIZE,
              TILE_SIZE
            );
          }
        }
      }

      function drawObject(object) {
        const centerX =
          object.x * TILE_SIZE +
          TILE_SIZE / 2;

        const centerY =
          object.y * TILE_SIZE +
          TILE_SIZE / 2;

        context.textAlign = "center";
        context.textBaseline = "middle";
        context.font = "700 10px system-ui";

        if (object.type === "playerSpawn") {
          context.fillStyle = "#d7b56d";

          context.beginPath();

          context.arc(
            centerX,
            centerY,
            12,
            0,
            Math.PI * 2
          );

          context.fill();

          context.fillStyle = "#1d231d";
          context.fillText("P", centerX, centerY);
        }

        if (object.type === "enemy") {
          context.fillStyle = "#a8515e";

          context.beginPath();

          context.arc(
            centerX,
            centerY,
            12,
            0,
            Math.PI * 2
          );

          context.fill();

          context.fillStyle = "#ffffff";
          context.fillText("E", centerX, centerY);
        }

        if (object.type === "key") {
          context.fillStyle = "#eed16e";

          context.beginPath();

          context.arc(
            centerX - 5,
            centerY,
            7,
            0,
            Math.PI * 2
          );

          context.fill();

          context.fillRect(
            centerX,
            centerY - 2,
            15,
            4
          );
        }

        if (object.type === "chest") {
          context.fillStyle = "#795333";

          context.fillRect(
            centerX - 14,
            centerY - 10,
            28,
            20
          );

          context.fillStyle = "#d7b56d";

          context.fillRect(
            centerX - 2,
            centerY - 4,
            4,
            8
          );
        }

        if (object.type === "exit") {
          context.strokeStyle = "#f0d375";
          context.lineWidth = 3;

          context.strokeRect(
            centerX - 13,
            centerY - 13,
            26,
            26
          );

          context.fillStyle = "#ffffff";
          context.fillText(
            "END",
            centerX,
            centerY
          );

          context.lineWidth = 1;
        }
      }

      function drawObjects() {
        for (const object of mapData.objects) {
          drawObject(object);
        }
      }

      function drawGrid() {
        context.strokeStyle =
          "rgba(255, 255, 255, 0.12)";

        context.lineWidth = 1;

        for (
          let x = 0;
          x <= mapData.columns;
          x += 1
        ) {
          context.beginPath();

          context.moveTo(
            x * TILE_SIZE,
            0
          );

          context.lineTo(
            x * TILE_SIZE,
            canvas.height
          );

          context.stroke();
        }

        for (
          let y = 0;
          y <= mapData.rows;
          y += 1
        ) {
          context.beginPath();

          context.moveTo(
            0,
            y * TILE_SIZE
          );

          context.lineTo(
            canvas.width,
            y * TILE_SIZE
          );

          context.stroke();
        }
      }

      function drawEditor() {
        context.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        drawBackground();
        drawCollisionLayer();
        drawObjects();
        drawForegroundLayer();
        drawGrid();
      }

      canvas.addEventListener(
        "mousedown",
        (event) => {
          isDrawing = true;
          paintCell(event);
        }
      );

      canvas.addEventListener(
        "mousemove",
        (event) => {
          if (
            !isDrawing ||
            activeLayer === "objects"
          ) {
            return;
          }

          paintCell(event);
        }
      );

      window.addEventListener(
        "mouseup",
        () => {
          isDrawing = false;
        }
      );

      previewAssetButton.addEventListener(
        "click",
        () => {
          previewAsset(
            assetPathInput.value
          );
        }
      );

      addAssetButton.addEventListener(
        "click",
        addBackgroundAsset
      );

      applyBackgroundButton.addEventListener(
        "click",
        applySelectedBackground
      );

      backgroundOpacityInput.addEventListener(
        "input",
        () => {
          const opacity =
            Number(
              backgroundOpacityInput.value
            );

          backgroundOpacityText.textContent =
            `${Math.round(opacity * 100)}%`;

          if (mapData.background) {
            mapData.background.opacity =
              opacity;
          }

          updateJson();
          drawEditor();
        }
      );

      saveButton.addEventListener(
        "click",
        () => {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(mapData)
          );

          saveStatus.textContent =
            "已儲存，可返回遊戲重新讀取";
        }
      );

      clearLayerButton.addEventListener(
        "click",
        clearCurrentLayer
      );

      resetDefaultButton.addEventListener(
        "click",
        () => {
          mapData = createDefaultMap();

          activeLayer = "collision";
          activeTool = 1;

          backgroundOpacityInput.value =
            String(
              mapData.background.opacity
            );

          backgroundOpacityText.textContent =
            "100%";

          renderLayerButtons();
          renderToolButtons();
          renderAssetLibrary();

          synchronizeCanvasSize();
          loadEditorBackground();

          markUnsaved("已還原預設地圖");
        }
      );

      resizeButton.addEventListener(
        "click",
        resizeMap
      );

      applyJsonButton.addEventListener(
        "click",
        () => {
          try {
            mapData = normalizeMap(
              JSON.parse(
                jsonTextarea.value
              )
            );

            renderAssetLibrary();
            synchronizeCanvasSize();
            loadEditorBackground();

            backgroundOpacityInput.value =
              String(
                mapData.background?.opacity ?? 1
              );

            backgroundOpacityText.textContent =
              `${Math.round(
                (
                  mapData.background?.opacity ??
                  1
                ) * 100
              )}%`;

            markUnsaved(
              "JSON 已套用，尚未儲存"
            );
          } catch (error) {
            alert(
              `JSON 格式錯誤：${error.message}`
            );
          }
        }
      );

      exportButton.addEventListener(
        "click",
        () => {
          const content =
            JSON.stringify(
              mapData,
              null,
              2
            );

          const blob =
            new Blob(
              [content],
              {
                type: "application/json"
              }
            );

          const url =
            URL.createObjectURL(blob);

          const anchor =
            document.createElement("a");

          anchor.href = url;
          anchor.download =
            "mist-ruins-map-v3.json";

          anchor.click();

          URL.revokeObjectURL(url);
        }
      );

      importInput.addEventListener(
        "change",
        async () => {
          const file =
            importInput.files?.[0];

          if (!file) {
            return;
          }

          try {
            const content =
              await file.text();

            mapData = normalizeMap(
              JSON.parse(content)
            );

            renderAssetLibrary();
            synchronizeCanvasSize();
            loadEditorBackground();

            backgroundOpacityInput.value =
              String(
                mapData.background?.opacity ?? 1
              );

            backgroundOpacityText.textContent =
              `${Math.round(
                (
                  mapData.background?.opacity ??
                  1
                ) * 100
              )}%`;

            markUnsaved(
              "JSON 已匯入，尚未儲存"
            );
          } catch (error) {
            alert(
              `匯入失敗：${error.message}`
            );
          } finally {
            importInput.value = "";
          }
        }
      );

      renderLayerButtons();
      renderToolButtons();
      renderAssetLibrary();

      backgroundOpacityInput.value =
        String(
          mapData.background?.opacity ?? 1
        );

      backgroundOpacityText.textContent =
        `${Math.round(
          (
            mapData.background?.opacity ??
            1
          ) * 100
        )}%`;

      synchronizeCanvasSize();
      loadEditorBackground();
    })();
  </script>
</body>
</html>
