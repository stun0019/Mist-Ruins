<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#cfe8ee">

  <title>櫻庭競技場｜11 vs 11 Demo</title>

  <link rel="stylesheet" href="./styles.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="game-container"></div>

  <div id="start-screen" class="screen">
    <div class="start-panel">
      <p class="eyebrow">SAKURA ARENA · MATCH V0.4</p>
      <h1>櫻庭競技場</h1>
      <p class="scene-name">11 VS 11 自動攻防測試</p>

      <p class="description">
        紅藍雙方將依照陣型自行防守、壓迫、傳球與射門。
        目前為 Three.js 行為測試版本，角色使用低多邊形暫代模型。
      </p>

      <button id="start-button" type="button">開始比賽</button>

      <div class="controls">
        <span>AI 自動比賽</span>
        <span>拖曳調整視角</span>
        <span>雙指／滾輪縮放</span>
        <span>雙擊重置鏡頭</span>
      </div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="match-board">
      <div class="team team-red">
        <span class="team-dot"></span>
        <strong>赤櫻</strong>
      </div>

      <div class="score">
        <strong id="red-score">0</strong>
        <span>—</span>
        <strong id="blue-score">0</strong>
      </div>

      <div class="team team-blue">
        <strong>蒼月</strong>
        <span class="team-dot"></span>
      </div>

      <div id="match-clock" class="match-clock">00:00</div>
    </div>

    <div class="scene-status">
      <span class="scene-status-dot"></span>
      <span id="match-status">比賽進行中</span>
    </div>

    <div class="hint">
      鏡頭自動跟隨足球 · 拖曳可微調視角
    </div>
  </div>

  <noscript>此場景需要啟用 JavaScript。</noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
