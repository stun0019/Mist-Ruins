<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#cfe8ee">

  <title>櫻庭競技場｜Three.js Scene Demo</title>

  <link rel="stylesheet" href="./styles.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="game-container"></div>

  <div id="start-screen" class="screen">
    <div class="start-panel">
      <p class="eyebrow">SAKURA ARENA · SCENE V0.3</p>
      <h1>櫻庭競技場</h1>
      <p class="scene-name">日式祭典競技場場景測試</p>

      <p class="description">
        以影片中的斜俯視競技場為參考，先建立條紋草地、紅色球門、
        觀眾席、鳥居、櫻花樹、燈籠與場外祭典裝飾。
      </p>

      <button id="start-button" type="button">查看場景</button>

      <div class="controls">
        <span>拖曳旋轉</span>
        <span>滾輪縮放</span>
        <span>雙擊重置</span>
        <span>目前無角色</span>
      </div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="location">
      <span class="location-label">CURRENT AREA</span>
      <strong>櫻庭競技場</strong>
    </div>

    <div class="scene-status">
      <span class="scene-status-dot"></span>
      場景展示模式
    </div>

    <div class="hint">
      拖曳旋轉 · 滾輪縮放 · 雙擊重置
    </div>
  </div>

  <noscript>此場景需要啟用 JavaScript。</noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
