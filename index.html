<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#05040d"
  >

  <title>影界覺醒｜影王試煉大殿</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="game-container"></div>

  <div
    id="start-screen"
    class="screen"
  >
    <div class="start-panel">
      <p class="eyebrow">
        SHADOW ASCENT · SCENE V0.2
      </p>

      <h1>影界覺醒</h1>

      <p class="scene-name">
        影王試煉大殿
      </p>

      <p class="description">
        沉睡於地底的試煉之門再次甦醒。
        紫色魔力沿著大殿蔓延，而王座後方的影界裂隙，
        正在等待新的覺醒者。
      </p>

      <button
        id="start-button"
        type="button"
      >
        進入試煉
      </button>

      <div class="controls">
        <span>WASD 移動</span>
        <span>滑鼠轉向</span>
        <span>Shift 加速</span>
        <span>Esc 暫停</span>
      </div>
    </div>
  </div>

  <div
    id="pause-screen"
    class="screen hidden"
  >
    <div class="pause-panel">
      <p class="eyebrow">
        TRIAL PAUSED
      </p>

      <h2>試煉暫停</h2>

      <p>
        點擊畫面繼續探索
      </p>
    </div>
  </div>

  <div
    id="hud"
    class="hidden"
  >
    <div class="location">
      <span class="location-label">
        CURRENT AREA
      </span>

      <strong>
        影王試煉大殿
      </strong>
    </div>

    <div
      class="crosshair"
      aria-hidden="true"
    ></div>

    <div class="trial-status">
      <span class="trial-status-dot"></span>
      影界能量正在甦醒
    </div>

    <div class="hint">
      WASD 移動 · Shift 加速 · Esc 暫停
    </div>
  </div>

  <noscript>
    此遊戲需要啟用 JavaScript。
  </noscript>

  <script
    type="module"
    src="./src/main.js"
  ></script>
</body>
</html>
