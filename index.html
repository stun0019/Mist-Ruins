<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>迷霧遺跡｜Mist Ruins</title>

  <style>
    :root {
      --background: #090d0a;
      --panel: rgba(20, 29, 22, 0.96);
      --border: #39463c;
      --text: #f3f0df;
      --muted: #a7b2a8;
      --accent: #d7b56d;
      --button: #28352b;
      --button-hover: #344538;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(
          circle at top,
          #263128 0%,
          #111712 45%,
          #080b09 100%
        );
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .game-layout {
      width: min(1280px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 16px;
    }

    .game-panel,
    .info-panel {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    .game-panel {
      min-width: 0;
      padding: 10px;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 11px;
      background: #101712;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      touch-action: none;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(7, 11, 8, 0.86);
      font-weight: 700;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
    }

    .info-panel {
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .stats {
      margin-top: 20px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid #344036;
    }

    .stat-row span {
      color: var(--muted);
    }

    .stat-row strong {
      text-align: right;
    }

    .controls {
      margin-top: 20px;
      display: grid;
      gap: 9px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .controls b {
      color: var(--text);
    }

    .actions {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    button,
    .button {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #526155;
      border-radius: 10px;
      background: var(--button);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover,
    .button:hover {
      background: var(--button-hover);
    }

    .notice {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .status-message {
      color: var(--accent);
    }

    @media (max-width: 900px) {
      body {
        padding: 8px;
      }

      .game-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="game-layout">
    <section class="game-panel">
      <div class="canvas-container">
        <canvas
          id="gameCanvas"
          width="960"
          height="540"
          aria-label="迷霧遺跡遊戲畫面"
        ></canvas>

        <div id="loadingOverlay" class="loading-overlay">
          場景載入中
        </div>
      </div>
    </section>

    <aside class="info-panel">
      <h1>迷霧遺跡</h1>

      <div class="subtitle">
        Mist Ruins｜2D 世界探索原型
      </div>

      <div class="stats">
        <div class="stat-row">
          <span>生命</span>
          <strong id="hpText">5 / 5</strong>
        </div>

        <div class="stat-row">
          <span>鑰匙</span>
          <strong id="keyText">0</strong>
        </div>

        <div class="stat-row">
          <span>敵人</span>
          <strong id="enemyText">0</strong>
        </div>

        <div class="stat-row">
          <span>場景</span>
          <strong id="sceneText">Starting Area</strong>
        </div>

        <div class="stat-row">
          <span>狀態</span>
          <strong id="statusText" class="status-message">
            探索中
          </strong>
        </div>
      </div>

      <div class="controls">
        <div><b>WASD／方向鍵</b>：移動</div>
        <div><b>Space</b>：攻擊</div>
        <div><b>E</b>：互動</div>
        <div><b>R</b>：返回出生點</div>
      </div>

      <div class="actions">
        <button id="reloadMapButton" type="button">
          重新讀取地圖
        </button>

        <button id="resetGameButton" type="button">
          重置遊戲進度
        </button>

        <a class="button" href="scripteditor.html">
          開啟場景編輯器
        </a>
      </div>

      <div class="notice">
        在場景編輯器完成 Path 碰撞與物件配置後，
        按下「儲存到瀏覽器」，再回到遊戲重新讀取。
      </div>
    </aside>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "mistRuinsMapV4";

      const VIEW_WIDTH = 960;
      const VIEW_HEIGHT = 540;

      const canvas =
        document.getElementById("gameCanvas");

      const context =
        canvas.getContext("2d");

      const loadingOverlay =
        document.getElementById("loadingOverlay");

      const hpText =
        document.getElementById("hpText");

      const keyText =
        document.getElementById("keyText");

      const enemyText =
        document.getElementById("enemyText");

      const sceneText =
        document.getElementById("sceneText");

      const statusText =
        document.getElementById("statusText");

      const reloadMapButton =
        document.getElementById("reloadMapButton");

      const resetGameButton =
        document.getElementById("resetGameButton");

      if (!context) {
        throw new Error("瀏覽器不支援 Canvas 2D。");
      }

      context.imageSmoothingEnabled = false;

      const input = Object.create(null);

      const camera = {
        x: 0,
        y: 0
      };

      let activeMap;
      let gameState;

      let backgroundImage = null;
      let backgroundReady = false;

      let previousTime = performance.now();

      let attackPressed = false;
      let interactPressed = false;

      function createDefaultMap() {
        return {
          version: 4,

          width: 1920,
          height: 1080,

          background: {
            assetId: "starting-area",
            name: "Starting Area",
            src: "./assets/BG/Starting%20Area.png",
            opacity: 1,
            visible: true
          },

          assets: {
            backgrounds: [
              {
                id: "starting-area",
                name: "Starting Area",
                src: "./assets/BG/Starting%20Area.png"
              }
            ]
          },

          collisionPaths: [
            {
              id: "world-border-top",
              type: "polygon",
              points: [
                { x: 0, y: 0 },
                { x: 1920, y: 0 },
                { x: 1920, y: 24 },
                { x: 0, y: 24 }
              ]
            },
            {
              id: "world-border-bottom",
              type: "polygon",
              points: [
                { x: 0, y: 1056 },
                { x: 1920, y: 1056 },
                { x: 1920, y: 1080 },
                { x: 0, y: 1080 }
              ]
            },
            {
              id: "world-border-left",
              type: "polygon",
              points: [
                { x: 0, y: 0 },
                { x: 24, y: 0 },
                { x: 24, y: 1080 },
                { x: 0, y: 1080 }
              ]
            },
            {
              id: "world-border-right",
              type: "polygon",
              points: [
                { x: 1896, y: 0 },
                { x: 1920, y: 0 },
                { x: 1920, y: 1080 },
                { x: 1896, y: 1080 }
              ]
            }
          ],

          foregroundPaths: [],

          objects: [
            {
              id: "player-spawn",
              type: "playerSpawn",
              x: 220,
              y: 540
            },
            {
              id: "enemy-1",
              type: "enemy",
              x: 720,
              y: 480
            },
            {
              id: "enemy-2",
              type: "enemy",
              x: 1120,
              y: 650
            },
            {
              id: "key-1",
              type: "key",
              x: 1430,
              y: 410
            },
            {
              id: "chest-1",
              type: "chest",
              x: 1580,
              y: 760
            },
            {
              id: "exit-1",
              type: "exit",
              x: 1760,
              y: 540
            }
          ]
        };
      }

      function normalizePoint(point) {
        return {
          x: Number(point?.x) || 0,
          y: Number(point?.y) || 0
        };
      }

      function normalizePath(path, index) {
        return {
          id:
            String(path?.id || `path-${index}`),

          type: "polygon",

          points: Array.isArray(path?.points)
            ? path.points.map(normalizePoint)
            : []
        };
      }

      function normalizeMap(data) {
        if (
          !data ||
          !Number.isFinite(Number(data.width)) ||
          !Number.isFinite(Number(data.height))
        ) {
          throw new Error("地圖尺寸格式錯誤。");
        }

        data.width =
          Math.max(320, Number(data.width));

        data.height =
          Math.max(240, Number(data.height));

        if (!data.assets) {
          data.assets = {};
        }

        if (!Array.isArray(data.assets.backgrounds)) {
          data.assets.backgrounds = [];
        }

        if (!Array.isArray(data.collisionPaths)) {
          data.collisionPaths = [];
        }

        if (!Array.isArray(data.foregroundPaths)) {
          data.foregroundPaths = [];
        }

        if (!Array.isArray(data.objects)) {
          data.objects = [];
        }

        data.collisionPaths =
          data.collisionPaths.map(normalizePath);

        data.foregroundPaths =
          data.foregroundPaths.map(normalizePath);

        data.objects = data.objects.map(
          (object, index) => ({
            id:
              String(
                object.id ||
                `${object.type || "object"}-${index}`
              ),

            type:
              String(object.type || "unknown"),

            x:
              Number(object.x) || 0,

            y:
              Number(object.y) || 0
          })
        );

        return data;
      }

      function loadMapData() {
        try {
          const stored =
            localStorage.getItem(STORAGE_KEY);

          if (!stored) {
            return createDefaultMap();
          }

          return normalizeMap(
            JSON.parse(stored)
          );
        } catch (error) {
          console.error(
            "地圖讀取失敗：",
            error
          );

          return createDefaultMap();
        }
      }

      function findMapObject(type) {
        return activeMap.objects.find(
          (object) => object.type === type
        );
      }

      function createGameState() {
        const spawn =
          findMapObject("playerSpawn") || {
            x: 160,
            y: 160
          };

        return {
          player: {
            x: spawn.x,
            y: spawn.y,

            radius: 10,
            speed: 190,

            maxHp: 5,
            hp: 5,

            keys: 0,

            directionX: 0,
            directionY: 1,

            attackTime: 0,
            invulnerableTime: 0
          },

          enemies: activeMap.objects
            .filter(
              (object) =>
                object.type === "enemy"
            )
            .map((object) => ({
              id: object.id,

              x: object.x,
              y: object.y,

              radius: 10,
              speed: 56,

              maxHp: 3,
              hp: 3,

              hitTime: 0,
              dead: false
            })),

          pickups: activeMap.objects
            .filter(
              (object) =>
                object.type === "key" ||
                object.type === "chest"
            )
            .map((object) => ({
              id: object.id,
              type: object.type,

              x: object.x,
              y: object.y,

              collected: false
            })),

          completed: false
        };
      }

      function setStatus(message) {
        statusText.textContent = message;
      }

      function loadBackground() {
        backgroundImage = null;
        backgroundReady = false;

        const source =
          activeMap.background?.src;

        sceneText.textContent =
          activeMap.background?.name ||
          "無背景";

        if (
          !source ||
          activeMap.background?.visible === false
        ) {
          loadingOverlay.classList.add("hidden");
          return;
        }

        loadingOverlay.textContent =
          "場景載入中";

        loadingOverlay.classList.remove("hidden");

        const image = new Image();

        image.addEventListener(
          "load",
          () => {
            backgroundImage = image;
            backgroundReady = true;

            loadingOverlay.classList.add("hidden");

            setStatus("場景載入完成");
          }
        );

        image.addEventListener(
          "error",
          () => {
            backgroundImage = null;
            backgroundReady = false;

            loadingOverlay.textContent =
              "背景圖片載入失敗";

            setStatus("背景圖片載入失敗");
          }
        );

        image.src = source;
      }

      function initializeGame() {
        activeMap = loadMapData();
        gameState = createGameState();

        camera.x = 0;
        camera.y = 0;

        loadBackground();
        updateInterface();
      }

      function pointInPolygon(
        pointX,
        pointY,
        polygonPoints
      ) {
        let inside = false;

        for (
          let current = 0,
            previous = polygonPoints.length - 1;

          current < polygonPoints.length;

          previous = current++
        ) {
          const currentPoint =
            polygonPoints[current];

          const previousPoint =
            polygonPoints[previous];

          const denominator =
            previousPoint.y -
            currentPoint.y;

          const safeDenominator =
            denominator === 0
              ? Number.EPSILON
              : denominator;

          const intersects =
            currentPoint.y > pointY !==
              previousPoint.y > pointY &&
            pointX <
              (
                (
                  previousPoint.x -
                  currentPoint.x
                ) *
                (
                  pointY -
                  currentPoint.y
                )
              ) /
                safeDenominator +
                currentPoint.x;

          if (intersects) {
            inside = !inside;
          }
        }

        return inside;
      }

      function isPointBlocked(pointX, pointY) {
        if (
          pointX < 0 ||
          pointY < 0 ||
          pointX > activeMap.width ||
          pointY > activeMap.height
        ) {
          return true;
        }

        return activeMap.collisionPaths.some(
          (path) =>
            path.points.length >= 3 &&
            pointInPolygon(
              pointX,
              pointY,
              path.points
            )
        );
      }

      function isCircleBlocked(
        centerX,
        centerY,
        radius
      ) {
        const diagonal =
          radius * 0.72;

        const samplePoints = [
          { x: centerX, y: centerY },

          {
            x: centerX - radius,
            y: centerY
          },

          {
            x: centerX + radius,
            y: centerY
          },

          {
            x: centerX,
            y: centerY - radius
          },

          {
            x: centerX,
            y: centerY + radius
          },

          {
            x: centerX - diagonal,
            y: centerY - diagonal
          },

          {
            x: centerX + diagonal,
            y: centerY - diagonal
          },

          {
            x: centerX - diagonal,
            y: centerY + diagonal
          },

          {
            x: centerX + diagonal,
            y: centerY + diagonal
          }
        ];

        return samplePoints.some(
          (point) =>
            isPointBlocked(
              point.x,
              point.y
            )
        );
      }

      function moveEntity(
        entity,
        movementX,
        movementY
      ) {
        const nextX =
          entity.x + movementX;

        if (
          !isCircleBlocked(
            nextX,
            entity.y,
            entity.radius
          )
        ) {
          entity.x = nextX;
        }

        const nextY =
          entity.y + movementY;

        if (
          !isCircleBlocked(
            entity.x,
            nextY,
            entity.radius
          )
        ) {
          entity.y = nextY;
        }
      }

      function distanceBetween(
        first,
        second
      ) {
        return Math.hypot(
          first.x - second.x,
          first.y - second.y
        );
      }

      function resetPlayerPosition() {
        const spawn =
          findMapObject("playerSpawn") || {
            x: 160,
            y: 160
          };

        gameState.player.x = spawn.x;
        gameState.player.y = spawn.y;

        setStatus("返回出生點");
      }

      function performAttack() {
        const player = gameState.player;

        if (player.attackTime > 0) {
          return;
        }

        player.attackTime = 0.22;

        const attackX =
          player.x +
          player.directionX * 30;

        const attackY =
          player.y +
          player.directionY * 30;

        for (const enemy of gameState.enemies) {
          if (enemy.dead) {
            continue;
          }

          const distance =
            Math.hypot(
              enemy.x - attackX,
              enemy.y - attackY
            );

          if (distance > 38) {
            continue;
          }

          enemy.hp -= 1;
          enemy.hitTime = 0.14;

          moveEntity(
            enemy,
            player.directionX * 14,
            player.directionY * 14
          );

          if (enemy.hp <= 0) {
            enemy.dead = true;
            setStatus("敵人已擊倒");
          } else {
            setStatus("攻擊命中");
          }
        }
      }

      function attemptInteraction() {
        setStatus("附近沒有可互動物件");
      }

      function updatePlayer(deltaTime) {
        const player = gameState.player;

        let movementX = 0;
        let movementY = 0;

        if (input.w || input.arrowup) {
          movementY -= 1;
        }

        if (input.s || input.arrowdown) {
          movementY += 1;
        }

        if (input.a || input.arrowleft) {
          movementX -= 1;
        }

        if (input.d || input.arrowright) {
          movementX += 1;
        }

        if (
          movementX !== 0 ||
          movementY !== 0
        ) {
          const length =
            Math.hypot(
              movementX,
              movementY
            );

          movementX /= length;
          movementY /= length;

          player.directionX = movementX;
          player.directionY = movementY;

          moveEntity(
            player,

            movementX *
              player.speed *
              deltaTime,

            movementY *
              player.speed *
              deltaTime
          );
        }

        if (
          input.space &&
          !attackPressed
        ) {
          performAttack();
        }

        attackPressed =
          Boolean(input.space);

        if (
          input.e &&
          !interactPressed
        ) {
          attemptInteraction();
        }

        interactPressed =
          Boolean(input.e);

        player.attackTime = Math.max(
          0,
          player.attackTime - deltaTime
        );

        player.invulnerableTime = Math.max(
          0,
          player.invulnerableTime -
            deltaTime
        );
      }

      function updateEnemies(deltaTime) {
        const player = gameState.player;

        for (const enemy of gameState.enemies) {
          if (enemy.dead) {
            continue;
          }

          enemy.hitTime = Math.max(
            0,
            enemy.hitTime - deltaTime
          );

          const distance =
            distanceBetween(enemy, player);

          if (
            distance < 260 &&
            distance > 28
          ) {
            const directionX =
              (player.x - enemy.x) /
              distance;

            const directionY =
              (player.y - enemy.y) /
              distance;

            moveEntity(
              enemy,

              directionX *
                enemy.speed *
                deltaTime,

              directionY *
                enemy.speed *
                deltaTime
            );
          }

          if (
            distance <= 27 &&
            player.invulnerableTime <= 0
          ) {
            player.hp -= 1;

            player.invulnerableTime = 1;

            setStatus("受到敵人攻擊");

            if (player.hp <= 0) {
              player.hp = player.maxHp;
              player.keys = 0;

              resetPlayerPosition();

              setStatus("你在出生區重新甦醒");
            }
          }
        }
      }

      function updatePickups() {
        const player = gameState.player;

        for (const pickup of gameState.pickups) {
          if (pickup.collected) {
            continue;
          }

          if (
            distanceBetween(
              pickup,
              player
            ) > 27
          ) {
            continue;
          }

          pickup.collected = true;

          if (pickup.type === "key") {
            player.keys += 1;
            setStatus("取得遺跡鑰匙");
          }

          if (pickup.type === "chest") {
            player.hp = player.maxHp;

            setStatus(
              "開啟寶箱，生命恢復"
            );
          }
        }
      }

      function updateExit() {
        const exit =
          findMapObject("exit");

        if (!exit) {
          return;
        }

        if (
          distanceBetween(
            gameState.player,
            exit
          ) < 30
        ) {
          gameState.completed = true;

          setStatus("出生區探索完成");
        }
      }

      function updateCamera(deltaTime) {
        const targetX =
          gameState.player.x -
          VIEW_WIDTH / 2;

        const targetY =
          gameState.player.y -
          VIEW_HEIGHT / 2;

        const maxX =
          Math.max(
            0,
            activeMap.width -
              VIEW_WIDTH
          );

        const maxY =
          Math.max(
            0,
            activeMap.height -
              VIEW_HEIGHT
          );

        const finalX =
          Math.min(
            maxX,
            Math.max(0, targetX)
          );

        const finalY =
          Math.min(
            maxY,
            Math.max(0, targetY)
          );

        const followSpeed =
          Math.min(1, deltaTime * 8);

        camera.x +=
          (finalX - camera.x) *
          followSpeed;

        camera.y +=
          (finalY - camera.y) *
          followSpeed;
      }

      function updateInterface() {
        hpText.textContent =
          `${gameState.player.hp} / ` +
          `${gameState.player.maxHp}`;

        keyText.textContent =
          String(gameState.player.keys);

        enemyText.textContent =
          String(
            gameState.enemies.filter(
              (enemy) => !enemy.dead
            ).length
          );
      }

      function update(deltaTime) {
        if (!gameState.completed) {
          updatePlayer(deltaTime);
          updateEnemies(deltaTime);
          updatePickups();
          updateExit();
        }

        updateCamera(deltaTime);
        updateInterface();
      }

      function drawBackground() {
        context.fillStyle = "#233126";

        context.fillRect(
          0,
          0,
          VIEW_WIDTH,
          VIEW_HEIGHT
        );

        if (
          !backgroundReady ||
          !backgroundImage
        ) {
          return;
        }

        const scaleX =
          backgroundImage.naturalWidth /
          activeMap.width;

        const scaleY =
          backgroundImage.naturalHeight /
          activeMap.height;

        const sourceX =
          camera.x * scaleX;

        const sourceY =
          camera.y * scaleY;

        const sourceWidth =
          Math.min(
            backgroundImage.naturalWidth -
              sourceX,

            VIEW_WIDTH * scaleX
          );

        const sourceHeight =
          Math.min(
            backgroundImage.naturalHeight -
              sourceY,

            VIEW_HEIGHT * scaleY
          );

        context.save();

        context.globalAlpha =
          activeMap.background?.opacity ?? 1;

        context.drawImage(
          backgroundImage,

          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,

          0,
          0,

          sourceWidth / scaleX,
          sourceHeight / scaleY
        );

        context.restore();
      }

      function drawPickup(pickup) {
        if (pickup.collected) {
          return;
        }

        const screenX =
          pickup.x - camera.x;

        const screenY =
          pickup.y - camera.y;

        if (pickup.type === "key") {
          context.fillStyle = "#eed16e";

          context.beginPath();

          context.arc(
            screenX - 5,
            screenY,
            7,
            0,
            Math.PI * 2
          );

          context.fill();

          context.fillRect(
            screenX,
            screenY - 2,
            16,
            4
          );

          context.fillRect(
            screenX + 10,
            screenY,
            3,
            7
          );
        }

        if (pickup.type === "chest") {
          context.fillStyle = "#795333";

          context.fillRect(
            screenX - 15,
            screenY - 11,
            30,
            22
          );

          context.fillStyle = "#d7b56d";

          context.fillRect(
            screenX - 2,
            screenY - 4,
            4,
            8
          );
        }
      }

      function drawEnemy(enemy) {
        if (enemy.dead) {
          return;
        }

        const screenX =
          enemy.x - camera.x;

        const screenY =
          enemy.y - camera.y;

        context.fillStyle =
          enemy.hitTime > 0
            ? "#ffffff"
            : "#a8515e";

        context.beginPath();

        context.arc(
          screenX,
          screenY,
          enemy.radius,
          0,
          Math.PI * 2
        );

        context.fill();

        context.fillStyle = "#321a20";

        context.fillRect(
          screenX - 7,
          screenY - 4,
          4,
          4
        );

        context.fillRect(
          screenX + 3,
          screenY - 4,
          4,
          4
        );
      }

      function drawPlayer() {
        const player = gameState.player;

        const screenX =
          player.x - camera.x;

        const screenY =
          player.y - camera.y;

        context.save();

        if (
          player.invulnerableTime > 0 &&
          Math.floor(
            player.invulnerableTime * 14
          ) % 2 === 0
        ) {
          context.globalAlpha = 0.35;
        }

        context.fillStyle = "#d8b970";

        context.beginPath();

        context.arc(
          screenX,
          screenY,
          player.radius + 2,
          0,
          Math.PI * 2
        );

        context.fill();

        context.fillStyle = "#2b3127";

        context.fillRect(
          screenX - 6,
          screenY - 4,
          4,
          4
        );

        context.fillRect(
          screenX + 2,
          screenY - 4,
          4,
          4
        );

        context.restore();

        if (player.attackTime > 0) {
          const angle =
            Math.atan2(
              player.directionY,
              player.directionX
            );

          context.strokeStyle = "#f5e2a1";
          context.lineWidth = 6;
          context.lineCap = "round";

          context.beginPath();

          context.arc(
            screenX,
            screenY,
            32,
            angle - 0.65,
            angle + 0.65
          );

          context.stroke();

          context.lineWidth = 1;
        }
      }

      function drawForegroundPaths() {
        for (
          const path of
          activeMap.foregroundPaths
        ) {
          if (path.points.length < 3) {
            continue;
          }

          context.save();

          context.beginPath();

          context.moveTo(
            path.points[0].x -
              camera.x,

            path.points[0].y -
              camera.y
          );

          for (
            let index = 1;
            index < path.points.length;
            index += 1
          ) {
            context.lineTo(
              path.points[index].x -
                camera.x,

              path.points[index].y -
                camera.y
            );
          }

          context.closePath();

          context.fillStyle =
            "rgba(18, 42, 24, 0.60)";

          context.fill();

          context.restore();
        }
      }

      function drawCompletedOverlay() {
        if (!gameState.completed) {
          return;
        }

        context.fillStyle =
          "rgba(5, 8, 6, 0.76)";

        context.fillRect(
          0,
          0,
          VIEW_WIDTH,
          VIEW_HEIGHT
        );

        context.textAlign = "center";
        context.textBaseline = "middle";

        context.fillStyle = "#f2dc91";
        context.font =
          "700 40px system-ui";

        context.fillText(
          "出生區探索完成",
          VIEW_WIDTH / 2,
          VIEW_HEIGHT / 2 - 18
        );

        context.fillStyle = "#ffffff";
        context.font =
          "18px system-ui";

        context.fillText(
          "你已找到前往迷霧遺跡的道路",
          VIEW_WIDTH / 2,
          VIEW_HEIGHT / 2 + 30
        );
      }

      function draw() {
        context.clearRect(
          0,
          0,
          VIEW_WIDTH,
          VIEW_HEIGHT
        );

        drawBackground();

        for (
          const pickup of
          gameState.pickups
        ) {
          drawPickup(pickup);
        }

        for (
          const enemy of
          gameState.enemies
        ) {
          drawEnemy(enemy);
        }

        drawPlayer();
        drawForegroundPaths();
        drawCompletedOverlay();
      }

      function gameLoop(currentTime) {
        const deltaTime =
          Math.min(
            0.033,
            (
              currentTime -
              previousTime
            ) / 1000
          );

        previousTime = currentTime;

        update(deltaTime);
        draw();

        requestAnimationFrame(gameLoop);
      }

      window.addEventListener(
        "keydown",
        (event) => {
          const key =
            event.key.toLowerCase();

          input[key] = true;

          if (
            [
              " ",
              "arrowup",
              "arrowdown",
              "arrowleft",
              "arrowright"
            ].includes(key)
          ) {
            event.preventDefault();
          }

          if (key === "r") {
            resetPlayerPosition();
          }
        }
      );

      window.addEventListener(
        "keyup",
        (event) => {
          input[
            event.key.toLowerCase()
          ] = false;
        }
      );

      window.addEventListener(
        "blur",
        () => {
          for (
            const key of Object.keys(input)
          ) {
            input[key] = false;
          }

          attackPressed = false;
          interactPressed = false;
        }
      );

      reloadMapButton.addEventListener(
        "click",
        () => {
          initializeGame();

          setStatus(
            "已重新讀取地圖"
          );
        }
      );

      resetGameButton.addEventListener(
        "click",
        () => {
          gameState =
            createGameState();

          camera.x = 0;
          camera.y = 0;

          setStatus(
            "遊戲進度已重置"
          );
        }
      );

      initializeGame();

      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
